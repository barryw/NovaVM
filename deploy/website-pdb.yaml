apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: novavm-website
  namespace: novavm
  labels:
    app: novavm-website
    app.kubernetes.io/name: novavm-website
    app.kubernetes.io/component: website
    app.kubernetes.io/part-of: walker-heavy-industries
spec:
  # Keep at least one pod serving during voluntary disruptions (node drain,
  # cluster upgrade). Paired with replicas: 2 this guarantees the site stays
  # up while a node is cordoned/drained. (ADR 0007 / WAL-108)
  minAvailable: 1
  selector:
    matchLabels:
      app: novavm-website
