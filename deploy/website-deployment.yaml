apiVersion: apps/v1
kind: Deployment
metadata:
  name: novavm-website
  namespace: novavm
  labels:
    app: novavm-website
    app.kubernetes.io/name: novavm-website
    app.kubernetes.io/component: website
    app.kubernetes.io/part-of: walker-heavy-industries
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novavm-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novavm-website
    spec:
      containers:
        - name: website
          image: ghcr.io/barryw/novavm-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-secret
