# Host is the NovaVM product-site domain. novavm.dev is LIVE — Cloudflare zone
# active, proxied apex + www CNAME routed through the walkernet tunnel to
# in-cluster Traefik (WAL-59 / WAL-64). The cloudflare_zone_id repo secret must
# point at the novavm.dev zone for the deploy-time cache purge to succeed
# (infra/Keel owns the CF secret).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novavm-website
  namespace: novavm
  labels:
    app: novavm-website
    app.kubernetes.io/name: novavm-website
    app.kubernetes.io/component: website
    app.kubernetes.io/part-of: walker-heavy-industries
spec:
  ingressClassName: traefik
  rules:
    - host: novavm.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novavm-website
                port:
                  number: 80
    - host: www.novavm.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novavm-website
                port:
                  number: 80
