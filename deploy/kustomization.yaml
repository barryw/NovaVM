apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: novavm

resources:
  - website-deployment.yaml
  - website-service.yaml
  - website-ingress.yaml
  # namespace.yaml + ci-rbac.yaml are applied manually by infra (bootstrap), NOT via
  # CI: woodpecker:default can get a namespace but not patch/create it, so including
  # namespace.yaml here made `kubectl apply -k` fail on the namespace patch (WAL-66).

commonLabels:
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/barryw/novavm-website
    newTag: latest
