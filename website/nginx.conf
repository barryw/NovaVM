# NovaVM product site (novavm.whi.dev) nginx config.
# Serves the static site and the /health endpoint the k8s liveness/readiness
# probes hit (deploy/website-deployment.yaml). Mirrors the WHI product-site
# health-check convention (whi-brand web/nginx.conf, WAL-39).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Probe target — must return 200 for the rollout to go ready.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The browser emulator ships a WebAssembly core; make sure it streams with
    # the correct type (Chrome/Firefox require application/wasm for streaming
    # instantiation). nginx maps this in mime.types, but pin it for older bases.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
