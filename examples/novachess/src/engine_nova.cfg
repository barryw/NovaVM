# Nova Chess engine RAM image.
# Emits a 2-byte load address prefix followed by engine code/data loaded at
# $4000. The engine code must stay below Nova's $A000 MMIO window. Runtime BSS
# is capped below $2000; engine BSS lives at $2000-$3FFF. The engine's 2 KB
# transposition table lives at $A200-$A9FF.

MEMORY {
    HEADER: start = $0000, size = $0002, file = %O;
    ENGINE: start = $4000, size = $6000, file = %O;
    BSS:    start = $2000, size = $2000, type = rw;
    ZP:     start = $0002, size = $00FE, type = rw;
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    CODE:     load = ENGINE, type = rw;
    PST:      load = ENGINE, type = rw, optional = yes;
    RODATA:   load = ENGINE, type = rw, optional = yes;
    DATA:     load = ENGINE, type = rw, optional = yes;
    BSS:      load = BSS,    type = bss, optional = yes;
    ZEROPAGE: load = ZP,     type = zp, optional = yes;
}
