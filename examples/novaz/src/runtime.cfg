# NovaZ runtime ROM.
# Produces a 16K image mapped at $C000-$FFFF with CPU vectors at $FFFA.

MEMORY {
    ZP:      start = $0040, size = $C0,   type = rw;
    # RAM ends at $1FFF: $2000-$3FFF is the NOVAZ6.BIN segment (novaz6.cfg)
    # and $4000-$47FF its BSS. The linker errors if runtime BSS grows into it.
    # $0300-$041F is the canonical lib_call mailbox + resident loader band;
    # $0420-$08FF is the cross-runtime module-BSS band. NovaZ calls shared
    # modules from its save/load overlay, so VM-owned state must start at $0900.
    RAM:     start = $0900, size = $1700, type = rw;
    ROM:     start = $C000, size = $3FFA, fill = yes, fillval = $EA;
    VECTORS: start = $FFFA, size = $0006, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    BSS:      load = RAM,     type = bss, define = yes;
    VECTORS:  load = VECTORS, type = ro;
}
