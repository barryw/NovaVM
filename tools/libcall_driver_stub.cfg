# ld65 config: raw binary for the lib_call hardware-smoke driver, ORG $9F80.
# Only relative branches + fixed absolute data addresses, so the bytes are
# position-independent in practice; $9F80 matches where the smoke script POKEs it.
# Slot is $9F80..$9FDF (96 bytes) — the $9FE0+ stash region must stay clear.
MEMORY {
    MAIN: start = $9F80, size = $0060, file = %O;
}
SEGMENTS {
    CODE: load = MAIN, type = ro;
}
