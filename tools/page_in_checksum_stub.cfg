# ld65 config: raw binary for the page-in checksum stub, ORG $9F80.
# Only relative branches + fixed absolute data addresses, so the bytes are
# position-independent in practice; $9F80 matches where the BASIC driver POKEs it.
MEMORY {
    MAIN: start = $9F80, size = $0080, file = %O;
}
SEGMENTS {
    CODE: load = MAIN, type = ro;
}
