when:
  - event: tag

depends_on:
  - build-gate

labels:
  platform: linux/amd64
  backend: kubernetes

steps:
  - name: publish
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh build
      - dotnet publish e6502.Avalonia -c Release -r linux-x64 -p:SkipRomBuild=true -o publish/avalonia
      - dotnet publish e6502.MCP -c Release -r linux-x64 -o publish/mcp

  - name: package
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - TAG="$$CI_COMMIT_TAG"
      - tar -czf "nova-vm-$${TAG}-linux-x64.tar.gz" -C publish/avalonia .
      - tar -czf "nova-mcp-$${TAG}-linux-x64.tar.gz" -C publish/mcp .

  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) just before upload in place of the shared admin PAT. See ci.yaml.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: upload
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - sh .woodpecker/install-linux-ci-deps.sh release
      - TAG="$$CI_COMMIT_TAG"
      - gh release upload "$${TAG}" "nova-vm-$${TAG}-linux-x64.tar.gz" "nova-mcp-$${TAG}-linux-x64.tar.gz" --repo "$$CI_REPO" --clobber
