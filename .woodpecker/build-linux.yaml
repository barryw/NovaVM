when:
  - event: tag

depends_on:
  - build-gate

labels:
  platform: linux/amd64
  backend: kubernetes

steps:
  - name: publish
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet run --project e6502.Nova -c Release -- ci install-linux-deps build
      # Stage ROM/font resources first: the Avalonia publishes use
      # -p:SkipRomBuild=true and rely on pre-staged resources that only
      # `make binaries` produces (WAL-162 — nothing generated petscii_*.bin etc).
      - mkdir -p e6502.CLI/Resources e6502.FPGA/rom
      - make binaries
      # Linux RID matrix (WAL-164). e6502.Avalonia is PublishAot=true, so an
      # arm64 publish is a NativeAOT cross-compile that needs an aarch64 linker +
      # sysroot the amd64 dotnet/sdk image does not carry — `dotnet publish
      # e6502.Avalonia -r linux-arm64` exits 1 (blocked build-linux, draft v0.2.3).
      # e6502.MCP is *not* AOT (PublishTrimmed + PublishSingleFile, managed), so
      # its arm64 cross-publish works with no native toolchain.
      #   -> ship: avalonia+mcp linux-x64 (native AOT) and mcp linux-arm64
      #      (trimmed cross); the arm64 *GUI* tarball is deferred to WAL-165
      #      (AOT cross toolchain OR a native arm64 agent, CI-verified off the
      #      release critical path). No silent drop — the missing artifact is
      #      tracked, not hidden.
      - dotnet publish e6502.Avalonia -c Release -r linux-x64   -p:SkipRomBuild=true -o publish/avalonia-linux-x64
      - dotnet publish e6502.MCP      -c Release -r linux-x64                        -o publish/mcp-linux-x64
      - dotnet publish e6502.MCP      -c Release -r linux-arm64                       -o publish/mcp-linux-arm64

  - name: package
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - TAG="$$CI_COMMIT_TAG"
      - tar -czf "nova-vm-$${TAG}-linux-x64.tar.gz"    -C publish/avalonia-linux-x64 .
      - tar -czf "nova-mcp-$${TAG}-linux-x64.tar.gz"   -C publish/mcp-linux-x64 .
      # nova-vm (Avalonia GUI) linux-arm64 deferred to WAL-165 — see publish step.
      - tar -czf "nova-mcp-$${TAG}-linux-arm64.tar.gz" -C publish/mcp-linux-arm64 .

  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) just before upload in place of the shared admin PAT. See ci.yaml.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: upload
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - dotnet run --project e6502.Nova -c Release -- ci install-linux-deps release
      - TAG="$$CI_COMMIT_TAG"
      - gh release upload "$${TAG}" "nova-vm-$${TAG}-linux-x64.tar.gz" "nova-mcp-$${TAG}-linux-x64.tar.gz" "nova-mcp-$${TAG}-linux-arm64.tar.gz" --repo "$$CI_REPO" --clobber
