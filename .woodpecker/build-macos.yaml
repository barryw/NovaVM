when:
  - event: tag

depends_on:
  - build-gate

labels:
  platform: darwin/arm64

steps:
  - name: publish
    image: bash
    environment:
      LIBRARY_PATH: /opt/homebrew/lib:/opt/homebrew/opt/openssl/lib
    commands:
      # Stage ROM/font resources first (Avalonia uses -p:SkipRomBuild=true and
      # relies on pre-staged resources). `make binaries` needs cc65 (ca65/ld65)
      # + python3 + make on the macOS agent — the .csproj already expects a
      # w65c02-capable cc65 (WAL-162).
      #
      # WAL-164: the macOS agent had no cc65 on PATH (`ca65: No such file or
      # directory` killed `make binaries`). Rather than depend on a manual
      # `brew install cc65` on the agent host (non-reproducible host state), the
      # agent self-provisions cc65 like the linux leg — see the script for
      # details. It installs to $HOME/.local (no sudo, persists on the local
      # backend); we add that bin dir to PATH here for `make binaries`. `$$`
      # escapes Woodpecker's var substitution so $HOME/$PATH reach the shell.
      # Fallback escape hatch: `brew install cc65` on the agent.
      - sh .woodpecker/install-macos-cc65.sh
      - export PATH="$$HOME/.local/bin:$$PATH"
      - mkdir -p e6502.CLI/Resources e6502.FPGA/rom
      - make binaries
      - dotnet publish e6502.Avalonia -c Release -r osx-arm64 -p:SkipRomBuild=true -o publish/avalonia
      - dotnet publish e6502.MCP -c Release -r osx-arm64 -o publish/mcp

  - name: package
    image: bash
    commands:
      - TAG="$$CI_COMMIT_TAG"
      - tar -czf "nova-vm-$${TAG}-osx-arm64.tar.gz" -C publish/avalonia .
      - tar -czf "nova-mcp-$${TAG}-osx-arm64.tar.gz" -C publish/mcp .

  - name: upload
    image: bash
    environment:
      # WAL-70: mint a short-lived, single-repo App token (contents=write,
      # metadata=read) on the macOS host instead of the shared admin PAT.
      # ci/mint-token.sh is bash+openssl+curl only (no jq) so it runs on the
      # darwin/arm64 local backend where the go plugin image can't.
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - export GITHUB_TOKEN="$(bash ci/mint-token.sh)"
      - TAG="$$CI_COMMIT_TAG"
      - gh release upload "$${TAG}" "nova-vm-$${TAG}-osx-arm64.tar.gz" "nova-mcp-$${TAG}-osx-arm64.tar.gz" --repo "$$CI_REPO" --clobber
