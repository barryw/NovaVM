when:
  - event: tag

labels:
  platform: linux/amd64
  backend: kubernetes

steps:
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet run --project e6502.Nova -c Release -- ci install-linux-deps build
      - dotnet workload install wasm-tools
      # Generate+stage ROM/font resources via the repo's canonical entrypoint
      # before building, and serialize the project graph. Mirrors ci.yaml — the
      # tag build path had the same never-exercised gaps (WAL-162): missing
      # generated resources (petscii_*.bin) and a parallel nova.lib make race.
      - mkdir -p e6502.CLI/Resources e6502.FPGA/rom
      - make binaries
      - dotnet build -c Release -maxcpucount:1
      - dotnet test -c Release -maxcpucount:1 --verbosity normal

  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) in place of the shared admin PAT. See ci.yaml.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: create-release
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - dotnet run --project e6502.Nova -c Release -- ci install-linux-deps release
      - |
        TAG="$$CI_COMMIT_TAG"
        if gh release view "$${TAG}" --repo "$$CI_REPO" >/dev/null 2>&1; then
          echo "Release $${TAG} already exists, skipping creation"
        else
          # Release notes from the cog-generated changelog for this version
          # (build & release standard sec 3); fall back to GitHub auto-notes.
          cog changelog --at "$${TAG}" > RELEASE_NOTES.md 2>/dev/null || true
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$${TAG}" \
              --repo "$$CI_REPO" \
              --draft \
              --notes-file RELEASE_NOTES.md \
              --title "$${TAG}"
          else
            gh release create "$${TAG}" \
              --repo "$$CI_REPO" \
              --draft \
              --generate-notes \
              --title "$${TAG}"
          fi
        fi
