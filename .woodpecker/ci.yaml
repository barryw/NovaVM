when:
  - event: push
    branch: main

labels:
  platform: linux/amd64
  backend: kubernetes

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

steps:
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh build
      - cog check || true
      - dotnet workload install wasm-tools
      - dotnet build -c Release
      - dotnet test -c Release --verbosity normal

  # WAL-72/WAL-70: mint a short-lived, down-scoped GitHub App installation token
  # (product-ci profile: contents=write,metadata=read) in place of the shared
  # admin PAT. Minter is vendored in the woodpecker-release plugin image; GH_APP_*
  # are org-level Woodpecker secrets. Token (~1h TTL) lands in the shared workspace
  # and is consumed by `gh` below. (git push continues to use Woodpecker's own
  # forge credential, unaffected by this change.)
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: version-and-release
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - sh .woodpecker/install-linux-ci-deps.sh release
      - |
        # Check if a version bump is needed
        NEW_VERSION=$$(cog bump --auto --dry-run 2>/dev/null || true)
        if [ -z "$${NEW_VERSION}" ]; then
          echo "No version bump needed"
          exit 0
        fi
        echo "Bumping to v$${NEW_VERSION}"

        # Configure git for tagging
        git config user.name "Woodpecker CI"
        git config user.email "ci@barrywalker.io"

        # Create and push the tag
        cog bump --auto
        TAG="v$$(cog get-version)"
        git push origin "$${TAG}"

        # Create draft release
        gh release create "$${TAG}" \
          --repo "$$CI_REPO" \
          --draft \
          --generate-notes \
          --title "$${TAG}"
