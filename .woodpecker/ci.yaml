when:
  - event: push
    branch: main

labels:
  platform: linux/amd64
  backend: kubernetes

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

steps:
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh build
      - cog check || true
      - dotnet workload install wasm-tools
      - dotnet build -c Release
      - dotnet test -c Release --verbosity normal

  - name: version-and-release
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh release
      - |
        # Check if a version bump is needed
        NEW_VERSION=$$(cog bump --auto --dry-run 2>/dev/null || true)
        if [ -z "$${NEW_VERSION}" ]; then
          echo "No version bump needed"
          exit 0
        fi
        echo "Bumping to v$${NEW_VERSION}"

        # Configure git for tagging
        git config user.name "Woodpecker CI"
        git config user.email "ci@barrywalker.io"

        # Create and push the tag
        cog bump --auto
        TAG="v$$(cog get-version)"
        git push origin "$${TAG}"

        # Create draft release
        gh release create "$${TAG}" \
          --repo "$$CI_REPO" \
          --draft \
          --generate-notes \
          --title "$${TAG}"
