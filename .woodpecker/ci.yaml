when:
  - event: push
    branch: main

labels:
  platform: linux/amd64
  backend: kubernetes

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

steps:
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh build
      - cog check || true
      - dotnet workload install wasm-tools
      # Build + stage all ROM/font resources first via the repo's canonical
      # entrypoint. The .csproj files reference generated .bin resources
      # (petscii_*.bin, ehbasic.bin, module/app blobs) as pre-existing, but the
      # dotnet build path never ran `make binaries` — so a clean CI checkout was
      # missing them (WAL-162: "CS1566: Could not find petscii_upper.bin"). This
      # target uses only cc65 + python3 + make/cp (all provisioned above); it does
      # not compile rust (stage-web only copies .bin into the web dirs).
      - make binaries
      # -maxcpucount:1 serializes the MSBuild project graph. Several projects
      # each shell out to `make -C ehbasic`, which cascades to
      # `clean-nova-lib: rm -rf build` on the SHARED runtime/asm/build dir.
      # Parallel project builds race on it (WAL-162: "rm: cannot remove 'build':
      # Directory not empty" → "ar65: Could not open build/audio.o").
      - dotnet build -c Release -maxcpucount:1
      - dotnet test -c Release -maxcpucount:1 --verbosity normal

  # WAL-72/WAL-70: mint a short-lived, down-scoped GitHub App installation token
  # (product-ci profile: contents=write,metadata=read) in place of the shared
  # admin PAT. Minter is vendored in the woodpecker-release plugin image; GH_APP_*
  # are org-level Woodpecker secrets. Token (~1h TTL) lands in the shared workspace
  # and is consumed by `gh`/`git push` below.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  # WAL-41: adopt build/release standard — cog bump drives the version tag; the
  # pushed v tag triggers build-gate -> per-OS publish -> finalize (published Release).
  - name: version
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh release
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@barrywalker.io"
      - GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - rm -f "$CI_WORKSPACE/.ci-token"
      - git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/${CI_REPO}.git"
      - |
        # Build & release standard (sec 2): version through `cog bump --auto`.
        # cog exits non-zero when no conventional commits warrant a bump. Push the
        # commit AND lightweight tag explicitly: the CI checkout has no upstream
        # tracking (bare `git push` fatals) and `--follow-tags` refuses to push
        # cog's lightweight tags, so use `HEAD:main --tags`. Pushing the v tag
        # drives build-gate -> per-OS publish -> finalize (the published Release).
        if cog bump --auto; then
          git push origin HEAD:main --tags
        else
          echo "No conventional commits warrant a release"
        fi
