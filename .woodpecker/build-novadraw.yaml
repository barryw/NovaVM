# NovaDraw (SwiftUI macOS editor) — compile + test on the local macOS agent.
# Added for WAL-29 (editor convergence): the existing .NET pipelines do not
# build the Swift editor under NovaDraw/. Runs on the local Apple-silicon agent.
when:
  - event: push
    branch: main
    path:
      include:
        - NovaDraw/**
        - .woodpecker/build-novadraw.yaml
  # Validate the editor on pull requests that touch it (the PR event carries a
  # diff, so the path filter applies) ...
  - event: pull_request
    path:
      include:
        - NovaDraw/**
        - .woodpecker/build-novadraw.yaml
  # ... and on manual runs (which carry no diff, so no path filter) so the macOS
  # build/test gate can be run on demand before merge (WAL-35).
  - event: manual

# Route to the local macOS agent (same label the tag/macOS jobs use).
labels:
  platform: darwin/arm64

steps:
  - name: build-and-test
    image: bash
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # NovaDraw depends on the private PixelCanvasKit package via SPM. SwiftPM
      # runs git non-interactively, so give it a credential in a workspace-local
      # git config (never the shared runner's ~/.gitconfig). Woodpecker masks
      # the secret value in logs.
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - export GIT_CONFIG_GLOBAL="$CI_WORKSPACE/.gitconfig.ci"
      # Disable the osxkeychain credential helper BEFORE the authenticated SwiftPM
      # fetch. On the macOS runner, git's `credential approve` after a successful
      # package resolution makes the helper try to STORE "x-access-token" in the
      # login keychain; the default keychain has been switched to the locked
      # ci-build keychain by a prior release run and never restored, so the store
      # fails and macOS pops a "Keychain Not Found" dialog on the host (WAL-99).
      # The token is already in the rewritten URL, so no helper is needed.
      - git config --global credential.helper ""
      - git config --global url."https://x-access-token:$GITHUB_TOKEN@github.com/".insteadOf "https://github.com/"
      - cd NovaDraw
      - swift build
      - swift test
