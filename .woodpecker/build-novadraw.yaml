# NovaDraw (SwiftUI macOS editor) — compile + test on the local macOS agent.
# Added for WAL-29 (editor convergence): the existing .NET pipelines do not
# build the Swift editor under NovaDraw/. Runs on the local Apple-silicon agent.
when:
  - event: push
    branch: main
    path:
      include:
        - NovaDraw/**
        - .woodpecker/build-novadraw.yaml
  # Validate the editor on pull requests that touch it (the PR event carries a
  # diff, so the path filter applies) ...
  - event: pull_request
    path:
      include:
        - NovaDraw/**
        - .woodpecker/build-novadraw.yaml
  # ... and on manual runs (which carry no diff, so no path filter) so the macOS
  # build/test gate can be run on demand before merge (WAL-35).
  - event: manual

# Route to the local macOS agent (same label the tag/macOS jobs use).
labels:
  platform: darwin/arm64

steps:
  - name: build-and-test
    image: bash
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    commands:
      - cd NovaDraw
      - swift build
      - swift test
