when:
  - event: tag

depends_on:
  - build-linux
  - build-macos
  - build-windows

labels:
  platform: linux/amd64
  backend: kubernetes

steps:
  - name: finalize
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - sh .woodpecker/install-linux-ci-deps.sh release
      - gh release edit "$$CI_COMMIT_TAG" --draft=false --repo "$$CI_REPO"
