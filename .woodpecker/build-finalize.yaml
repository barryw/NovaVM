when:
  - event: tag

depends_on:
  - build-linux
  - build-macos
  - build-windows

labels:
  platform: linux/amd64
  backend: kubernetes

steps:
  # WAL-72/WAL-70: mint a short-lived GitHub App installation token (product-ci
  # profile) in place of the shared admin PAT. See ci.yaml.
  - name: mint-token
    image: ghcr.io/barryw/woodpecker-release:go
    pull: true
    environment:
      GH_APP_ID:
        from_secret: gh_app_id
      GH_APP_INSTALLATION_ID:
        from_secret: gh_app_installation_id
      GH_APP_PRIVATE_KEY:
        from_secret: gh_app_private_key
    commands:
      - /plugin/mint-installation-token.sh --profile product-ci > "$CI_WORKSPACE/.ci-token"
      - 'test -s "$CI_WORKSPACE/.ci-token" || { echo "FATAL: empty minted token"; exit 1; }'

  - name: finalize
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - export GITHUB_TOKEN=$(cat "$CI_WORKSPACE/.ci-token")
      - sh .woodpecker/install-linux-ci-deps.sh release
      - gh release edit "$$CI_COMMIT_TAG" --draft=false --repo "$$CI_REPO"
