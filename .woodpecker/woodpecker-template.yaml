# NovaVM product site (novavm.whi.dev) — deploy via release-static-site.
# Build & Release Standard §5 (WAL-32 / WAL-39 / WAL-51): the product site adopts
# the same kaniko -> GHCR -> k8s -> Cloudflare flow as every other WHI site. The
# config service (woodpecker-release) expands this into the full pipeline.
#
# Fires on website/** and deploy/** pushes to main (sites are not versioned
# releases; they ship on content change and are tagged by pipeline number).
#
# NOTE — ingress host (deploy/website-ingress.yaml) is novavm.whi.dev; infra/CEO
# must confirm the canonical product-site domain (WAL-40 tracks site URLs) and
# point the cloudflare_zone_id repo secret at the zone that owns it.
template: release-static-site
data:
  site: novavm
  k8s_namespace: novavm
  # website_context defaults to website/, dockerfile to website/Dockerfile,
  # image_name/deployment_name to "novavm-website", container to "website",
  # deploy_path to "deploy/", cloudflare_zone secret to "cloudflare_zone_id".
