# ld65 config for larger RAM diagnostics loaded at $7000.
#
# This leaves room for helper libraries with BSS/ZEROPAGE while staying below
# the Nova VGC register page at $A000. Load at $7000 and run with SYS $7000.

MEMORY {
    ZP:   start = $0040, size = $40, type = rw;
    CODE: start = $7000, size = $3000, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = CODE, type = bss, define = yes;
}
