MEMORY {
  # The NET module wraps the NIC helper runtime (nic.s) and the Nova Game Server
  # client protocol runtime (gameserver.s). The wrappers are stateless leaf
  # marshallers, but the included gameserver.s NDK body carries ~48 bytes of
  # private client state (session/keepalive/parse cursors) in its BSS segment.
  # ZP is declared (and sized small) only so the linker has somewhere to place
  # the empty ZEROPAGE segment.
  ZP:     start = $00A3, size = $0004, type = rw, define = yes;
  MODBSS: start = $0420, size = $0040, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  RODATA:   load = ROM,    type = ro;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
