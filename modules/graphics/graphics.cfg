MEMORY {
  # Module-owned RAM bands (NOT in the ROM image — addresses only, no file).
  #   ZP:  module-private ZP pointer window. libabi.inc reserves $14-$17 (LIB_ZP,
  #        4 bytes) as the cross-runtime-free module pointer band; the actual
  #        driver demand now exceeds that (vsprite.s: 3 bytes; msprite.s: 6 more
  #        — MSPRITE_DESC_PTR/PART_PTR/ANIM_PTR), so the window is extended to
  #        $14-$1C (9 bytes). Like MODBSS below, this is a PROVISIONAL placement:
  #        the formal cross-runtime ZP reservation is deferred. The window is only
  #        live while the module is paged in (the loader's BYTES deref at $14/$15
  #        is not live while a driver runs), so the bytes are shared safely.
  #   MODBSS: the GRAPHICS module's low-RAM state block. Lives in the formal
  #        cross-runtime module-BSS band $0420-$08FF (1248 B, libabi.inc
  #        MODULE_BSS_BAND..MODULE_BSS_BAND_END), carved by 4c.2-1 between the
  #        resident loader band ($0320-$041F) and runtime user RAM (Logo BSS /
  #        EhBASIC Ram_base, both at $0900). Every runtime reserves the band, so a
  #        paged-in GRAPHICS module's BSS never collides with the loader nor with
  #        runtime user RAM. Sized for vsprite/msprite state (320 B) plus the
  #        3x256 B turtle-render buffers landing in 4c.2-2; current size is $0140
  #        (320 B). It must NOT extend past $08FF (end of band) — keep
  #        start + size <= $0900. (4c.2-2 grows size to fill the band.)
  ZP:     start = $0014, size = $000B, type = rw, define = yes;
  MODBSS: start = $0420, size = $0140, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
