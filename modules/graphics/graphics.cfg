MEMORY {
  # Module-owned RAM bands (NOT in the ROM image — addresses only, no file).
  #   ZP:  the 4 always-free module ZP bytes ($14-$17) reserved by libabi.inc
  #        (LIB_ZP). vsprite.s needs 3 (VSPRITE_TMP + VSPRITE_DESC_PTR); the
  #        loader's BYTES deref (LIB_ZP=$14/$15) is not live while the driver
  #        runs, so they share the window safely.
  #   MODBSS: the GRAPHICS module's low-RAM state block. Placed immediately
  #        after the canonical mailbox ($0300-$031F). In EhBASIC this is the
  #        start of user program RAM (Ram_base=$0320), so a runtime that calls
  #        the vsprite/msprite (BSS-backed) ops must reserve this band — Logo
  #        (4c) owns the ROM slot and can; a live BASIC program must not call
  #        these ops while occupying $0320+. See the report / design note.
  ZP:     start = $0014, size = $0004, type = rw, define = yes;
  MODBSS: start = $0320, size = $0080, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
