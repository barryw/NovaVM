MEMORY {
  # The FILES module's handlers are stateless leaf wrappers over FIO/PAGER MMIO
  # and pseudo-registers — no module-private zero page, no BSS. The ZP/MODBSS
  # regions are declared (and sized small) only so the linker has somewhere to
  # place those (empty) segments; nothing lands there.
  ZP:     start = $00A3, size = $0004, type = rw, define = yes;
  MODBSS: start = $0420, size = $0004, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  RODATA:   load = ROM,    type = ro;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
