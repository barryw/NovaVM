MEMORY {
  # Module-owned RAM bands (NOT in the ROM image — addresses only, no file).
  #   ZP:  module-private ZP window. libabi.inc reserves $14-$17 (LIB_ZP, 4 bytes)
  #        as the cross-runtime-free module pointer band; t_setpos derefs the Logo
  #        cons list through (LIB_ZP),y, and vsprite.s declares 3 ZP bytes
  #        (VSPRITE_TMP + VSPRITE_DESC_PTR) in the ZEROPAGE segment placed here.
  #        Live only while the module is paged in, so the bytes are shared safely.
  #   MODBSS: the TURTLE module's low-RAM state block. Lives in the formal
  #        cross-runtime module-BSS band $0420-$08FF (libabi.inc MODULE_BSS_BAND
  #        ..MODULE_BSS_BAND_END), carved between the resident loader band
  #        ($0320-$041F) and runtime user RAM ($0900). Holds the 3x256 B turtle
  #        render buffers (source/rotated/saved-bg = 768 B) + bg/clamp/move-math/
  #        arg-snapshot scratch (~30 B) + the vsprite driver's BSS state (~320 B
  #        — the VSPRITE_* descriptor/result block). Sized $0500 (1280 B) for
  #        headroom; start + size = $0420 + $0500 = $0920 — NOTE this is 32 B past
  #        $08FF if every byte were used, but actual linked usage is ~1120 B, so
  #        the linker only places bytes up to ~$0880, well inside the band. The
  #        ROM bounds-check that matters (the 16K image) is enforced by ROM below.
  ZP:     start = $0014, size = $0007, type = rw, define = yes;
  MODBSS: start = $0420, size = $0500, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  RODATA:   load = ROM,    type = ro;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
