MEMORY {
  # Module-owned RAM bands (NOT in the ROM image — addresses only, no file).
  #   ZP:  SYSTEM-owned scratch plus NDK helper ZP for vtext/nui/vsprite. The
  #        module window stays at $A3-$C2, clear of the loader, the NVR band, and
  #        the host's persistent ZP. Only live while the module is paged in.
  #   MODBSS: SYSTEM service state and NDK helper BSS. Lives in the formal
  #        cross-runtime module-BSS band $0420-$08FF (libabi.inc
  #        MODULE_BSS_BAND..END), carved between the resident loader band
  #        ($0320-$041F) and runtime user RAM (Logo BSS / EhBASIC Ram_base, both
  #        at $0900).
  ZP:     start = $00A3, size = $0020, type = rw, define = yes;
  MODBSS: start = $0420, size = $04E0, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  RODATA:   load = ROM,    type = ro;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
