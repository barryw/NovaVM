MEMORY {
  # Module-owned RAM bands (NOT in the ROM image — addresses only, no file).
  #   ZP:  the editor's zero-page working window. The editor needs 25 contiguous
  #        bytes (editbuf 14 + editui 6 + vtext 5); below Logo's ZP floor ($30)
  #        there is no 25-byte gap (the loader owns $14-$17, nova.inc NVR scratch
  #        owns $20-$2F). So we place it at $A3-$C2 — exactly where the editor
  #        lived in the NovaLogo extension ROM (proven volatile-across-call for
  #        the host; clear of the loader, the NVR band, and the host's persistent
  #        ZP). Only live while the module is paged in. Like graphics' provisional
  #        $14-$1C band, the formal cross-runtime ZP reservation stays deferred.
  #   MODBSS: the editor's low-RAM state block (clipboard, cursor/scroll/selection
  #        state, render scratch — ~466 B). Lives in the formal cross-runtime
  #        module-BSS band $0420-$08FF (libabi.inc MODULE_BSS_BAND..END), carved
  #        between the resident loader band ($0320-$041F) and runtime user RAM
  #        (Logo BSS / EhBASIC Ram_base, both at $0900). This is strictly better
  #        than the extension's editor BSS at $9800, which sat inside Logo heap.
  ZP:     start = $00A3, size = $0020, type = rw, define = yes;
  MODBSS: start = $0420, size = $04E0, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  RODATA:   load = ROM,    type = ro;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
