MEMORY {
  # The MEMORY module wraps the XRAM core runtime and the XMC named-block
  # allocator. The wrappers are stateless leaf marshallers, but the included
  # xmc.s NDK body carries ~16 bytes of private allocator state (directory
  # cursor, page-run bookkeeping) in its BSS segment. ZP is declared (and sized
  # small) only so the linker has somewhere to place the empty ZEROPAGE segment.
  ZP:     start = $00A3, size = $0004, type = rw, define = yes;
  MODBSS: start = $0420, size = $0020, type = rw, define = yes;
  ROM:    start = $C000, size = $3FFA, fill = yes, file = %O;
  VECROM: start = $FFFA, size = $0006, fill = yes, file = %O;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  CODE:     load = ROM,    type = ro,  start = $C000;
  RODATA:   load = ROM,    type = ro;
  BSS:      load = MODBSS, type = bss;
  VECTORS:  load = VECROM, type = ro,  start = $FFFA;
}
