# editbuf_demo.cfg -- ld65 config for the standalone editor/dialog demo.
# Emits a 2-byte load address prefix ($00 $50), then code at $5000.

MEMORY {
    ZP:   start = $0040, size = $80, type = rw;
    HDR:  start = $0000, size = 2, fill = yes;
    BSS:  start = $1C00, size = $3400, type = rw;
    CODE: start = $5000, size = $5000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = BSS,  type = bss, define = yes;
}
