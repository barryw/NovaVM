# spritebank_test.cfg -- ld65 config for the spritebank harness ($7200).
# Pulls in anim/msprite/xram/dma + deps, so CODE is roomy and BSS lives low.
MEMORY {
    ZP:   start = $0040, size = $60, type = rw;
    HDR:  start = $0000, size = 2,    fill = yes;
    BSS:  start = $0400, size = $1400, type = rw;
    CODE: start = $7200, size = $2000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = BSS,  type = bss, define = yes;
}
