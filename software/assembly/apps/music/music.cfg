# demo.cfg -- ld65 config for demo disk autoboot binary
# Emits 2-byte load address prefix ($00 $72) followed by code at $7200

# ZP $30-$7F holds both music's vars and the linked keyboard library's (avoids
# nova.lib's NVR scratch at $20-$2F). CODE runs $7200-$9EFF now that the keyboard
# visualizer is linked in rather than loaded separately at $9000.
MEMORY {
    ZP:   start = $0030, size = $50, type = rw;
    HDR:  start = $0000, size = 2, fill = yes;
    CODE: start = $7200, size = $2D00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = CODE, type = bss, define = yes;
}
