# editbuf_test.cfg -- ld65 config for the standalone editbuf engine harness.
# Emits a 2-byte load address prefix ($00 $72) then code at $7200.
# BSS lives low ($1000-$6FFF) so it never collides with code ($7200+) or the
# MMIO band ($A000+). The editable text buffer is fixed at $0400 (see the .s).

MEMORY {
    ZP:   start = $0040, size = $80, type = rw;
    HDR:  start = $0000, size = 2, fill = yes;
    BSS:  start = $1000, size = $6000, type = rw;
    CODE: start = $7200, size = $2E00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = BSS,  type = bss, define = yes;
}
