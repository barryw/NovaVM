# xramcheck.cfg -- 2-byte load address prefix ($00 $80) then code at $8000.
MEMORY {
    ZP:   start = $0014, size = $40, type = rw;
    HDR:  start = $0000, size = 2, fill = yes;
    CODE: start = $8000, size = $1000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = CODE, type = bss, define = yes;
}
