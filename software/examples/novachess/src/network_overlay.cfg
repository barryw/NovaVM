# Nova Chess network-mode overlay.
# This slot intentionally overlaps the full AI engine region. Network mode loads
# the rules-only engine, which ends well below $6000; the kernel unloads overlays
# before loading another engine image.

MEMORY {
    OVL: start = $6000, size = $3000, file = %O;
}

SEGMENTS {
    CODE:   load = OVL, type = rw;
    RODATA: load = OVL, type = rw, optional = yes;
    DATA:   load = OVL, type = rw, optional = yes;
    BSS:    load = OVL, type = bss, define = yes;
}
