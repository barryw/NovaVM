# NovaZ save/load UI overlay.
# Fixed slot above NOVAZ6.BIN ($2000-$3FFF) and NOVAZ6 BSS ($4000-$47FF).

MEMORY {
    OVL: start = $4800, size = $2800, file = %O;
}

SEGMENTS {
    CODE:   load = OVL, type = rw;
    RODATA: load = OVL, type = rw, optional = yes;
    DATA:   load = OVL, type = rw, optional = yes;
    BSS:    load = OVL, type = bss, define = yes;
}
