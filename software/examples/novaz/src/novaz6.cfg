# NOVAZ6.BIN — RAM-resident V6 segment.
# Raw 8KB binary linked at $2000, loaded from the floppy by the runtime when
# the story is version 6. fill = yes keeps the image a fixed $2000 bytes so
# the boot loader always copies exactly 8KB. BSS lives above the image at
# $4000 and is never part of the file. No ZEROPAGE segment: the skeleton must
# not claim ZP; if a later task needs ZP it negotiates a range with the
# runtime then.

MEMORY {
    RAM6: start = $2000, size = $2000, type = rw, file = %O, fill = yes, fillval = $EA;
    # ld65 errors ("overflows memory area") if segment BSS outgrows this —
    # bump the size deliberately when Tasks 6-9 need more state.
    BSS6: start = $4000, size = $0800, type = rw, file = "";
}

SEGMENTS {
    CODE:     load = RAM6, type = ro;
    RODATA:   load = RAM6, type = ro;
    BSS:      load = BSS6, type = bss, define = yes;
}
