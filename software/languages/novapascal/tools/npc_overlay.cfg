MEMORY {
    ZP:  start = $0060, size = $0010, file = "";
    OVL: start = $2000, size = $8000, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = OVL, type = rw;
    RODATA:   load = OVL, type = rw, optional = yes;
    DATA:     load = OVL, type = rw, optional = yes;
    BSS:      load = OVL, type = bss, define = yes;
}
