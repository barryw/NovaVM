MEMORY {
    ZP:  start = $0070, size = $0030, file = "";
    HDR: start = $0000, size = $0002, file = %O;
    BIN: start = $4000, size = $3000, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    CODE:     load = BIN, type = rw;
    RODATA:   load = BIN, type = rw, optional = yes;
    DATA:     load = BIN, type = rw, optional = yes;
    BSS:      load = BIN, type = bss, define = yes;
}
