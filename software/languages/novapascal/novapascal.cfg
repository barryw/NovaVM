MEMORY {
    # $0060-$006F belongs to the NPC frontend overlay and $0070-$009F to the
    # transient tools in the $1D00 slot, so the shell's own zero page stops at
    # $005F. Widening this silently corrupts state across every tool launch.
    ZP:     file = "", define = yes, start = $0030, size = $0030;
    SCRATCH:file = "", define = yes, start = $0900, size = $1000;
    BSS:    file = "", define = yes, start = $1900, size = $0700;
    NPCFE:  file = "tools/build/npcfe.bin", start = $1E00, size = $8200;
    ROM:    file = %O,               start = $C000, size = $3FD7, fill = yes;
    MONROM: file = %O,               start = $FFD7, size = $0023, fill = yes;
    VECROM: file = %O,               start = $FFFA, size = $0006;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    SOURCEBUF:load = SCRATCH,type = bss;
    NPCFE_WORK:load = SCRATCH,type = bss;
    BSS:      load = BSS,    type = bss;
    NPCFE_CODE:   load = NPCFE, type = rw;
    NPCFE_RODATA: load = NPCFE, type = rw, optional = yes;
    CODE:     load = ROM,    type = ro, start = $C000;
    RODATA:   load = ROM,    type = ro;
    MONITOR:  load = MONROM, type = ro, start = $FFD7;
    VECTORS:  load = VECROM, type = ro, start = $FFFA;
}
