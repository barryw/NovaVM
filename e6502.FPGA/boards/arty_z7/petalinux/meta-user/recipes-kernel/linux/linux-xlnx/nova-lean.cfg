# nova-lean.cfg — strip drivers the NovaVM appliance never uses.
#
# The display + audio are ENTIRELY in the PL (the VGC drives HDMI directly; the
# SID/WTS engine produces HDMI audio), so Linux needs no graphics or sound stack
# at all. There's no wireless, CAN, camera/TV, NFS, or raw-flash storage on this
# board. Cutting these shrinks the kernel and removes their boot-time probes.
#
# Kept (do NOT add here): SD/MMC (rootfs+data), MACB gigabit ethernet, USB-HID
# (keyboard) + USB mass-storage (load disks off a stick), ext4/vfat, RTC, and
# UIO (the fio_bridge /dev/mem path to the PL).

# --- Graphics: the VGC owns HDMI; Linux never touches the display ---
# CONFIG_DRM is not set
# CONFIG_DRM_XLNX is not set

# --- Sound: audio is the PL SID/WTS engine over HDMI audio ---
# CONFIG_SOUND is not set
# CONFIG_SND is not set

# --- Wireless: wired gigabit ethernet only ---
# CONFIG_WLAN is not set

# --- CAN bus: unused ---
# CONFIG_CAN is not set

# --- Media / V4L / digital-TV: no camera or tuner ---
# CONFIG_MEDIA_SUPPORT is not set

# --- Kernel NFS client: userspace nfs-utils is also removed ---
# CONFIG_NFS_FS is not set

# --- Raw-flash filesystems: we boot from SD (ext4 + vfat) ---
# CONFIG_JFFS2_FS is not set

# --- Profiling: timestamp kernel log lines so boot timing is visible ---
CONFIG_PRINTK_TIME=y
