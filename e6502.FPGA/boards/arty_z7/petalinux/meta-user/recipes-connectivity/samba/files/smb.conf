[global]
   workgroup = WORKGROUP
   server string = NovaVM
   netbios name = NOVAVM
   security = user
   map to guest = Bad User
   guest account = root
   create mask = 0664
   directory mask = 0775
   log level = 0

[nova]
   comment = NovaVM filesystem
   path = /data/nova
   browseable = yes
   read only = no
   guest ok = yes
   force user = root
