#User Configuration

#OE_TERMINAL = "tmux"

# NovaVM appliance: extra packages + the appliance recipe (ssh key, samba, nova-fs, resize)
IMAGE_INSTALL:append = " samba avahi-daemon avahi-utils parted e2fsprogs-resize2fs util-linux-sfdisk util-linux-partx usbutils nova-appliance novavm"
# empty root password (easy serial login) + root ssh (the key auth comes from nova-appliance)
EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
PREFERRED_VERSION_libldb = "2.8.1"

# --- Lean appliance: the server/dev cruft removal (nfs-utils, tcf-agent,
# busybox-inetd) lives in recipes-core/images/petalinux-image-minimal.bbappend,
# NOT here -- a :remove in this conf never reaches do_rootfs (PetaLinux feeds the
# build from a stale generated build/conf), so it must be in a meta-user bbappend
# parsed directly. We keep avahi (mDNS -> novahost.local), samba, dbus, sshd, udhcpc. ---

# --- Read-only-rootfs appliance: the OS partition mounts ro (never dirty -> no
# fsck/journal recovery on a power-yank). /var/volatile + /run are already tmpfs.
# The writable nova-fs lives on its own ext4 /data partition (see nova-sd.wks);
# nova-firstboot grows it + seeds it from the ro /usr/share/nova-fs template. ---
EXTRA_IMAGE_FEATURES:append = " read-only-rootfs"
WKS_FILE = "nova-sd.wks"
# Add the power-on monkey hold-screen (built + deployed by the u-boot-xlnx-scr
# bbappend) to the FAT boot partition. Must be ":append", NOT ":zynq =" -- PetaLinux
# regenerates build/conf/petalinuxbsp.conf with its own IMAGE_BOOT_FILES:zynq
# ("BOOT.BIN boot.scr image.ub") every build, which clobbers a plain ":zynq =" here;
# an append survives it (same reason the read-only-rootfs append above sticks).
IMAGE_BOOT_FILES:append = " monkey.scr"
IMAGE_BOOT_FILES:zynq = "BOOT.BIN boot.scr uImage"

# Disarm the FSBL-armed SWDT early in boot. The watchdog-off init script (rcS S01,
# recipes-core/watchdog-off) magic-closes /dev/watchdog before the udev coldplug
# that used to starve the kernel pinger into a 120s cold-boot reset loop. Hobby
# board: no auto-recovery needed. watchdog0 stays ENABLED in system-user.dtsi so
# the cdns_wdt driver creates /dev/watchdog for the script to use.
IMAGE_INSTALL:append = " watchdog-off"
