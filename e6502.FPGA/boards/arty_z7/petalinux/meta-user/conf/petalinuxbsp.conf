#User Configuration

#OE_TERMINAL = "tmux"

# NovaVM appliance: extra packages + the appliance recipe (ssh key, samba, nova-fs, resize)
IMAGE_INSTALL:append = " samba avahi-daemon avahi-utils parted e2fsprogs-resize2fs util-linux-sfdisk util-linux-partx usbutils nova-appliance novavm"
# empty root password (easy serial login) + root ssh (the key auth comes from nova-appliance)
EXTRA_IMAGE_FEATURES:append = " debug-tweaks"
PREFERRED_VERSION_libldb = "2.8.1"

# --- Lean appliance: strip dev/server cruft we never use (mirrors the
# rootfs_config cuts for reproducibility). Dropping nfs-utils also removes the
# S15mountnfs.sh boot-time mount stall + rpcbind/rpc.statd; tcf-agent is the
# Xilinx TCF debug agent (S99). We keep avahi (mDNS -> novahost.local). ---

# --- Read-only-rootfs appliance: the OS partition mounts ro (never dirty -> no
# fsck/journal recovery on a power-yank). /var/volatile + /run are already tmpfs.
# The writable nova-fs lives on its own ext4 /data partition (see nova-sd.wks);
# nova-firstboot grows it + seeds it from the ro /usr/share/nova-fs template. ---
EXTRA_IMAGE_FEATURES:append = " read-only-rootfs"
WKS_FILE = "nova-sd.wks"
IMAGE_BOOT_FILES:zynq = "BOOT.BIN boot.scr uImage"
