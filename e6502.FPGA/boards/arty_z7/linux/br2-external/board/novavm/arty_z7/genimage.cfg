## NovaVM Arty Z7 SD image (option A: FSBL+U-Boot BOOT.bin, no SPL).
## Boot partition (FAT): BOOT.bin (BootROM->FSBL->bitstream->U-Boot), the kernel,
## the Arty DTB, and the extlinux config U-Boot's distro-boot scans for.
image boot.vfat {
	vfat {
		files = {
			"BOOT.bin",
			"uImage",
			"novavm-arty-z7.dtb"
		}
		file extlinux/extlinux.conf {
			image = "extlinux.conf"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
