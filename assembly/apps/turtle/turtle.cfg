# turtle.cfg -- ld65 config for 16x16 virtual-sprite turtle rotate demo
# Emits 2-byte load address prefix ($00 $72) followed by code at $7200.

MEMORY {
    ZP:   start = $0040, size = $40, type = rw;
    HDR:  start = $0000, size = 2, fill = yes;
    CODE: start = $7200, size = $4E00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = CODE, type = ro;
    RODATA:   load = CODE, type = ro;
    BSS:      load = CODE, type = bss, define = yes;
}
